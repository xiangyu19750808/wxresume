services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      JWT_SECRET: dev-secret-change-me
      DB_URL: file:./prisma/dev.db
      FLAG_ENABLE_WXPAY: "false"
      FLAG_ENABLE_RENDER_WORKER: "false"
      FLAG_ENABLE_RESUME_PARSE: "false"
    volumes:
      - api_data:/app/apps/api/prisma
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  api_data:
