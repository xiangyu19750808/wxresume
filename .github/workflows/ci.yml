name: ci

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CI: true
      DB_URL: file:./prisma/dev.db
      JWT_SECRET: dev-secret-please-change

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"   # 暂时关闭 pnpm cache 以排除影响

      # ✅ 不使用 action-setup，手动启用 Corepack 并激活 pnpm（官方推荐）
      - name: Enable Corepack & Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.7 --activate
          echo "$(pnpm env use --global 20)" || true
          pnpm -v

      # ✅ 确保 pnpm 可执行路径写入到 PATH
      - name: Add pnpm to PATH
        run: |
          echo "$(npm root -g)/.bin" >> $GITHUB_PATH
          which pnpm || echo "pnpm not found in PATH"
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @wxresume/api exec prisma generate --schema prisma/schema.prisma

      - name: Apply Prisma schema
        run: pnpm --filter @wxresume/api exec prisma db push --schema prisma/schema.prisma --skip-generate

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: OpenAPI lint
        run: pnpm api:openapi:lint
