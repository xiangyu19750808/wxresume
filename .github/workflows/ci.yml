name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 关键：用 corepack 安装并激活与 package.json 对齐的 pnpm 版本
      - name: Setup pnpm (via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@8.15.7 --activate
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # 下面按你的需要执行构建/测试；示例：
      # - name: Build
      #   run: pnpm -r build
      #
      # - name: Test
      #   run: pnpm -r test
