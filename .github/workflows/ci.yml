name: ci

on:
  workflow_dispatch:

  pull_request:
    branches: [ main ]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"

  push:
    branches: [ main ]
    paths:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (pnpm via npx)
        run: |
          npx -y pnpm@8.15.7 -v
          npx -y pnpm@8.15.7 install --no-frozen-lockfile

      - name: Boot API (light mode)
        env:
          E2E_LIGHT: '1'
          PORT: '9080'
        run: |
          nohup node apps/api/src/server.js > server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:9080/v1/health" >/dev/null; then
              echo "server is ready"; break
            fi
            echo "waiting server ($i/90) ..."
            sleep 1
          done
          curl -fsS "http://127.0.0.1:9080/v1/health"

      - name: End-to-end tests
        run: npx -y pnpm@8.15.7 run test:e2e

      - name: Print server log
        if: always()
        run: |
          echo "------------ server.log -------------"
          tail -n +1 server.log || true
          echo "-------------------------------------"
