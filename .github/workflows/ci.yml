name: build

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 安装 pnpm（保证后续命令可用）
      - name: Install pnpm
        run: |
          npm i -g pnpm
          pnpm -v

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ！！！关键：生成 Prisma Client（在 apps/api 目录执行）
      - name: Prisma generate
        working-directory: apps/api
        env:
          # 用 SQLite，文件将生成在 apps/api/dev.db
          DATABASE_URL: file:./dev.db
        run: |
          npx prisma generate
          # 同步 schema -> DB（避免测试用到的表不存在）
          npx prisma db push

      # 如果你的接口/中间件需要 JWT_SECRET，给测试环境一个值避免报错
      - name: Prepare test env
        run: echo "JWT_SECRET=dev-secret-please-change" >> $GITHUB_ENV

      # 构建（有的包可能没有 build 脚本，所以加 --if-present）
      - name: Build packages
        run: pnpm -r --if-present build

      # 单测（递归执行，只有存在 test 脚本的包才会跑）
      - name: Test packages
        run: pnpm -r --if-present test
