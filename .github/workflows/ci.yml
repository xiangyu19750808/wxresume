name: build

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ 设置 Node + 缓存 pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'  # 告诉 GitHub 使用 pnpm 缓存

      # ✅ 启用 corepack 并激活指定 pnpm 版本
      - name: Enable Corepack & Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.7 --activate
          pnpm -v

      # ✅ 安装依赖
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ✅ 运行 Prisma（和 schema 中的 DB_URL 保持一致）
      - name: Prisma generate & push
        working-directory: apps/api
        env:
          DB_URL: file:./dev.db
        run: |
          npx prisma generate
          npx prisma db push

      # ✅ 准备运行环境变量
      - name: Prepare runtime env
        run: echo "JWT_SECRET=dev-secret-please-change" >> $GITHUB_ENV

      # ✅ 构建所有包
      - name: Build packages
        run: pnpm -r --if-present build

      # ⚠️ 如需单元测试可开启
      # - name: Test packages
      #   run: pnpm -r --if-present test
