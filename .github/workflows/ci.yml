name: ci

on:
  workflow_dispatch:

  pull_request:
    branches: [ main ]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"

  push:
    branches: [ main ]
    paths:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 pnpm（固定 8.15.7）并启用缓存
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 端到端测试：给定必要的环境变量，使用固定端口 9080
      - name: End-to-end tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci-secret
          PORT: 9080
        run: pnpm -w run test:e2e

      # 如需恢复构建/单测可解除注释
      # - name: Build
      #   run: pnpm -w -r build
      #
      # - name: Test
      #   run: pnpm -w -r test
