name: ci

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CI: true
      DB_URL: file:./prisma/dev.db
      JWT_SECRET: dev-secret-please-change

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm (Force Installation)
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "pnpm installed version: $(pnpm -v)" # Check pnpm version

      - name: Install dependencies
        run: |
          echo "Installing dependencies"
          pnpm install --frozen-lockfile
          echo "Dependencies installed"

      - name: Generate Prisma client
        run: |
          echo "Generating Prisma client"
          pnpm --filter @wxresume/api exec prisma generate --schema prisma/schema.prisma

      - name: Apply Prisma schema
        run: |
          echo "Applying Prisma schema"
          pnpm --filter @wxresume/api exec prisma db push --schema prisma/schema.prisma --skip-generate

      - name: Install Playwright browsers
        run: |
          echo "Installing Playwright browsers"
          pnpm exec playwright install chromium

      - name: Lint
        run: |
          echo "Running lint"
          pnpm lint

      - name: Unit tests
        run: |
          echo "Running unit tests"
          pnpm test:unit

      - name: End-to-end tests
        run: |
          echo "Running end-to-end tests"
          pnpm test:e2e

      - name: OpenAPI lint
        run: |
          echo "Running OpenAPI lint"
          pnpm api:openapi:lint

      - name: Run api-check
        run: |
          echo "Running api-check"
          pnpm run api-check

      - name: Run build
        run: |
          echo "Running build"
          pnpm run build
