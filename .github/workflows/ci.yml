name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'   # 这行无害，后面我们手动装 pnpm，也能利用缓存

      # ✅ 关键：用 npm 全局安装 pnpm（与 package.json 的 packageManager 版本一致）
      - name: Install pnpm globally
        run: |
          npm i -g pnpm@8.15.7
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # 下面按你的需要继续（没需要就先不写）
      # - name: Build
      #   run: pnpm -r build
      # - name: Test
      #   run: pnpm -r test
