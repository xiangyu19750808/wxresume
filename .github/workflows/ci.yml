name: ci

on:
  pull_request:
    branches: [ main ]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
  push:
    branches: [ main ]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.15.7 --activate
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: End-to-end tests
        run: npx -y pnpm@8.15.7 run test:e2e

      # 关键：只构建 API 包，避免其它包无 build 脚本导致失败
      - name: Build API only
        run: pnpm --filter @wxresume/api build
