name: ci


on:
  workflow_dispatch:

  pull_request:
    branches: [ main ]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"

  push:
    branches: [ main ]
    paths:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (pnpm via npx)
        run: |
          npx -y pnpm@8.15.7 -v
          npx -y pnpm@8.15.7 install --no-frozen-lockfile

      # - name: Build
      #   run: npx -y pnpm@8.15.7 -r build

      # - name: Test
      #   run: npx -y pnpm@8.15.7 -r test
