name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ✅ 用 NPX 调用 pnpm，零依赖、绝对可用
      - name: Install dependencies (pnpm via npx)
        shell: bash
        run: |
          npx -y pnpm@8.15.7 -v
          npx -y pnpm@8.15.7 install --no-frozen-lockfile

      # 如果你要 build / test，照下面这样写（同样用 npx 调 pnpm）
      # - name: Build
      #   run: npx -y pnpm@8.15.7 -r build
      # - name: Test
      #   run: npx -y pnpm@8.15.7 -r test
