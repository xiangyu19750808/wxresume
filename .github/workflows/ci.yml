name: build

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: |
          npm i -g pnpm
          pnpm -v

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # === 关键：给 Prisma 提供 DB_URL（与你的 schema 一致）===
      - name: Prisma generate & push
        working-directory: apps/api
        env:
          DB_URL: file:./dev.db
        run: |
          npx prisma generate
          npx prisma db push

      - name: Prepare test env
        run: echo "JWT_SECRET=dev-secret-please-change" >> $GITHUB_ENV

      - name: Build packages
        run: pnpm -r --if-present build

      - name: Test packages
        run: pnpm -r --if-present test
