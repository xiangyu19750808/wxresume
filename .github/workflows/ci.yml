name: ci

on:
  pull_request:
    branches: [ main ]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
      - "tests/**"
  push:
    branches: [ main ]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
      - "tests/**"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: "9080"
      JWT_SECRET: test-secret
      BASE_URL: http://127.0.0.1:9080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.15.7 --activate
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # 如果 api 需要构建或数据库迁移/灌数，请放开这些注释
      # - name: Build API
      #   run: pnpm --filter @wxresume/api build
      # - name: DB migrate
      #   run: pnpm --filter @wxresume/api migrate
      # - name: DB seed
      #   run: pnpm --filter @wxresume/api seed

      - name: Start API on ${{ env.PORT }}
        shell: bash
        run: |
          set -e
          # 后台启动并记录 PID
          node apps/api/src/server.js > server.log 2>&1 & echo $! > api.pid

          # 等待健康就绪（兼容 /v1/health 和 /health）
          npx --yes wait-on -t 60000 http://127.0.0.1:${PORT}/v1/health || \
          npx --yes wait-on -t 60000 http://127.0.0.1:${PORT}/health || {
            echo "API failed to become healthy"
            tail -n +1 server.log || true
            exit 7
          }

      - name: Run E2E
        run: pnpm run test:e2e

      - name: Stop API
        if: always()
        shell: bash
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) || true
            rm -f api.pid
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
