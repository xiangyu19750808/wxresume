name: build

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm            # ← 关键新增
        run: |
          npm i -g pnpm@8.15.7
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm -r --if-present build

      - name: Test
        run: pnpm -r --if-present test
