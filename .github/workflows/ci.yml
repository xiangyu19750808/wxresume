name: build

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      # ✅ 拉取代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ 安装 pnpm（最关键一步）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.7
          run_install: false

      # ✅ 设置 Node.js 并缓存 pnpm 依赖
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # ✅ 验证 pnpm 是否安装成功
      - name: Verify pnpm
        run: pnpm -v

      # ✅ 安装依赖
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ✅ Prisma generate & push
      - name: Prisma generate & push
        working-directory: apps/api
        env:
          DB_URL: file:./dev.db
        run: |
          npx prisma generate
          npx prisma db push

      # ✅ 设置运行环境变量
      - name: Prepare runtime env
        run: echo "JWT_SECRET=dev-secret-please-change" >> $GITHUB_ENV

      # ✅ 构建项目
      - name: Build packages
        run: pnpm -r --if-present build

      # ✅ 运行测试（Node 原生测试 + pretest.mjs）
      - name: Run tests
        run: pnpm test

      # ✅ 运行 api-check 校验
      - name: Run API Checks
        run: |
          # 健康检查
          curl http://localhost:8080/v1/health
          
          # JD解析接口测试
          curl -X POST -H "Content-Type: application/json" -d '{"raw_text":"3+years experience, proficient in SQL/Excel, familiar with Tableau, good communication"}' http://localhost:8080/v1/jd/parse

          # 匹配分数接口测试
          curl -X POST -H "Content-Type: application/json" -d '{"jd_text":"3 years experience, SQL Excel Tableau"}' http://localhost:8080/v1/match/score

          # 渲染接口测试
          curl -X POST -H "Content-Type: application/json" -d '{"html":"<div style=\"font-size:24px\">Smoke Test PDF</div>"}' http://localhost:8080/v1/render/pdf

          # 其他 API 测试...
      
      # ✅ Lint OpenAPI 校验
      - name: Lint OpenAPI
        run: pnpm -r --if-present api:openapi:lint
