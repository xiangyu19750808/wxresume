name: ci

on:
  # 先加上手动触发，防止路径不命中时不好触发
  workflow_dispatch:

  # 保留 PR 触发
  pull_request:
    branches: [ main ]

    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"


  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # - name: Test (all)
      #   run: pnpm -r test
