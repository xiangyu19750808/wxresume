name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm i -g pnpm@8.15.7

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: End-to-end tests (E2E_LIGHT)
        run: |
          export E2E_LIGHT=1
          export PORT=9080
          pnpm -C apps/api dev > server.log 2>&1 & echo $! > server.pid

          for i in {1..90}; do
            echo "waiting server (/90) ..."
            if curl -fsS http://127.0.0.1:9080/v1/health >/dev/null; then
              echo "server is up"
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:9080/v1/health >/dev/null; then
            echo "::error ::API failed to start"
            tail -n +1 server.log || true
            exit 7
          fi

          BASE_URL=http://127.0.0.1:9080 pnpm test:e2e

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
