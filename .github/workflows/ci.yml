name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # 统一在 job 级设置轻量环境变量
      E2E_LIGHT: "1"
      NODE_ENV: test
      PORT: "9080"
      JWT_SECRET: ci-dev-secret
      COS_PROVIDER: fake
      SIGN_EXPIRES_SEC: "60" 
      # Prisma 用这个变量（schema.prisma: env("DB_URL")）
      DB_URL: "file:./dev-ci.db"
      # CI 用 SQLite 临时库（apps/api 下相对路径）
      DATABASE_URL: "file:./dev-ci.db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm i -g pnpm@8.15.7

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ---- Prisma：在 apps/api 下生成 Client + 应用迁移 ----
      - name: Prisma generate & migrate deploy
        working-directory: apps/api
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy --schema prisma/schema.prisma

      # ---- 启动 API（后台）----
      - name: Start API (E2E_LIGHT on :9080)
        working-directory: apps/api
        run: |
          pnpm dev > ../../server.log 2>&1 & echo $! > ../../server.pid

      # ---- 等待健康检查（最多 90 秒）----
      - name: Wait for /v1/health
        run: |
          for i in {1..90}; do
            echo "waiting server ($i/90) ..."
            if curl -fsS http://127.0.0.1:9080/v1/health >/dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error ::API failed to start"
          tail -n +500 server.log || true
          exit 7

      # ---- 执行 E2E ----
      - name: End-to-end tests
        run: |
          BASE_URL=http://127.0.0.1:9080 pnpm test:e2e

      # ---- 上传日志（便于排查）----
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
