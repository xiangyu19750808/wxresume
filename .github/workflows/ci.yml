name: ci

on:
  pull_request:
    paths:
      - '**'
  push:
    branches: [ main ]
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Ensure pnpm on PATH
        shell: bash
        run: |
          set -e
          corepack enable || true
          corepack prepare pnpm@8.15.7 --activate || true
          if ! command -v pnpm >/dev/null 2>&1; then
            npm i -g pnpm@8.15.7
          fi
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # 你在 ci.yml 里需要做的事情放到这里
      # - name: Run tests
      #   run: pnpm -r test
