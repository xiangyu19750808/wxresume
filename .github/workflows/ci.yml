name: ci

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CI: true
      DB_URL: file:./prisma/dev.db
      JWT_SECRET: dev-secret-please-change

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version  # Confirm pnpm is installed and available
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @wxresume/api exec prisma generate --schema prisma/schema.prisma

      - name: Apply Prisma schema
        run: pnpm --filter @wxresume/api exec prisma db push --schema prisma/schema.prisma --skip-generate

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: OpenAPI lint
        run: pnpm api:openapi:lint
