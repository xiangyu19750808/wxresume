name: ci

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CI: true
      DB_URL: file:./prisma/dev.db
      JWT_SECRET: dev-secret-please-change

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # ✅ 关键修正：使用官方 pnpm/action-setup，而不是 npm install -g
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # 建议与项目中 pnpm-lock.yaml 对应的版本一致

      # ✅ 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ✅ 生成 Prisma Client
      - name: Generate Prisma client
        run: pnpm --filter @wxresume/api exec prisma generate --schema prisma/schema.prisma

      # ✅ 应用 Prisma Schema
      - name: Apply Prisma schema
        run: pnpm --filter @wxresume/api exec prisma db push --schema prisma/schema.prisma --skip-generate

      # ✅ 安装 Playwright 浏览器
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      # ✅ Lint 检查
      - name: Lint
        run: pnpm lint

      # ✅ 单元测试
      - name: Unit tests
        run: pnpm test:unit

      # ✅ 端到端测试
      - name: End-to-end tests
        run: pnpm test:e2e

      # ✅ OpenAPI 规范检查
      - name: OpenAPI lint
        run: pnpm api:openapi:lint
