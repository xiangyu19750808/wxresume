name: ci

on:
  pull_request:
    branches: [ main ]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
      - "tests/**"
  push:
    branches: [ main ]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
      - "tests/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.15.7 --activate
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # 启动 API，并等待 9080 端口健康可用（关键修复点）
      - name: Start API (E2E_LIGHT) on 9080
        shell: bash
        run: |
          set -e
          export PORT=9080
          export JWT_SECRET=test-secret
          node apps/api/src/server.js > server.log 2>&1 &
          for i in {1..90}; do
            curl -fsS "http://127.0.0.1:${PORT}/v1/health" && exit 0
            sleep 1
          done
          echo "API failed to start"
          tail -n +1 server.log || true
          exit 7

      # 端到端测试（若你用的是统一脚本）
      - name: Run E2E
        run: pnpm run test:e2e

      # 失败时把 server.log 传出来便于排查
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
