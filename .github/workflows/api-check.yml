name: api-check

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: api-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 安装 pnpm
      - name: Install pnpm (fix)
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "export PATH=$HOME/.local/share/pnpm:$PATH" >> $GITHUB_ENV
          pnpm -v  # 检查 pnpm 是否安装成功

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Lint OpenAPI
        run: pnpm -r --if-present api:openapi:lint

      - name: Lint (optional)
        run: pnpm -r --if-present lint
