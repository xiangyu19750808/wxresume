# .github/workflows/api-check.yml
name: api-check

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: api-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 关键：用官方 action 安装指定版本 pnpm，最稳
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.7
          run_install: false

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # 如果 openapi 的校验脚本在根 package.json，就保留这一条；
      # 如果脚本在 apps/api 里，请改成下面那条（已注释）的形式。
      - name: Lint OpenAPI
        run: pnpm -r --if-present api:openapi:lint
      # - name: Lint OpenAPI (apps/api)
      #   working-directory: apps/api
      #   run: pnpm --if-present api:openapi:lint

      - name: Lint (optional)
        run: pnpm -r --if-present lint
