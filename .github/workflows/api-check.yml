# .github/workflows/api-check.yml
name: api-check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-check.yml'
  push:
    branches: [ main ]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@8.15.7 --activate
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # 有哪个包里定义就会在哪个包里执行；没定义也不会报错
      - name: Lint OpenAPI
        run: pnpm -r --if-present api:openapi:lint

      - name: Lint (optional)
        run: pnpm -r --if-present lint
