name: api-check

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-check.yml'
  push:
    branches: [ main ]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-check.yml'

jobs:
  api-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 安装/激活 pnpm（先 corepack，失败再全局 npm 安装兜底）
      - name: Ensure pnpm on PATH
        shell: bash
        run: |
          set -e
          echo "Trying corepack..."
          corepack enable || true
          corepack prepare pnpm@8.15.7 --activate || true
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "corepack didn't expose pnpm, installing via npm..."
            npm i -g pnpm@8.15.7
          fi
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Lint OpenAPI
        run: pnpm api:openapi:lint
