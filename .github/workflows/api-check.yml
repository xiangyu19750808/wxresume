name: api-check

on:
  # 允许手动触发
  workflow_dispatch:
  # PR 触发（去掉 paths 限制，保证 PR 都会跑）
  pull_request:
    branches: [ main ]
  # 可选：推送到 main 时也跑
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: api-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 安装 pnpm（关键）
      - name: Install pnpm
        run: |
          npm i -g pnpm
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Lint OpenAPI
        run: pnpm -r --if-present api:openapi:lint

      - name: Lint (optional)
        run: pnpm -r --if-present lint
