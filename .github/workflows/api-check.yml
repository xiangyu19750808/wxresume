# .github/workflows/api-check.yml

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: |
          npm install -g pnpm
          pnpm -v  # 确保 pnpm 安装成功

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Lint OpenAPI
        run: pnpm api:openapi:lint
