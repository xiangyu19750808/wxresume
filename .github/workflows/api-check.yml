name: ci

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 关键：同样激活 pnpm
      - name: Setup pnpm via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@8.15.7 --activate
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # 看你的项目目前 build 是 no-op；加一个“容错构建”，避免无脚本时报错
      - name: Build (no-op safe)
        run: pnpm -r build || true
