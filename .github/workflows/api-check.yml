name: api-check

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ✅ 同样用 NPX 调 pnpm
      - name: Install deps (pnpm via npx)
        run: |
          npx -y pnpm@8.15.7 -v
          npx -y pnpm@8.15.7 install --no-frozen-lockfile

      - name: Lint OpenAPI
        run: npx -y pnpm@8.15.7 api:openapi:lint
