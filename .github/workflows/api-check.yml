name: api-check

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: api-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 安装 pnpm (确保 pnpm 安装且在环境中可用)
      - name: Install pnpm
        run: |
          npm install -g pnpm
          pnpm -v  # 检查 pnpm 版本，确保安装成功

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # 执行 API Lint 检查
      - name: Lint OpenAPI
        run: pnpm -r --if-present api:openapi:lint
